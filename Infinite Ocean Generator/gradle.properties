org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true

# Mod Info
mod_version = 0.0.01-Pre-Alpha
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1]

mod_id = infinite_ocean_generator
mod_name = Infinite Ocean Generator
mod_group_id=com.Dramora9879.mods.infinite_ocean_generator
mod_authors = Dramora9879
mod_description=Adds an Infinite Ocean world type that generates natural and boundless oceans with rolling seafloor, new and vanilla ocean biomes, and a customizable spawn method.
mod_license=All Rights Reserved

# NeoForge
# https://neoforged.net/
neo_version = 21.1.219
neo_version_range = [21.1.219,)

# Mappings
# https://parchmentmc.org/docs/getting-started
#
# parchment_minecraft_version being set to "same" will use minecraft_version
# parchment_version set to "none" will disable parchment mappings
parchment_minecraft_version = same
parchment_version = 2024.11.17

# registrate
registrate_version = MC1.21-1.3.0+67

## Optional Dependency versions (resolved at compile/runtime)
# Compile against the Sable that the bundled Simulated was built against; the
# runtime version (sable_mod_version) can float higher within the same major.
sable_version=2.0.0
sable_companion_version=1.6.0
create_version=6.0.10-280
flywheel_version=1.0.6
ponder_version=1.0.81
veil_version=4.0.1
jei_version = 19.21.0.247
curios_version = 9.2.2
sodium_version = 0.6.9
cc_tweaked_enable = true
cc_tweaked_version = 1.120.2
farmers_delight_enable = true
farmers_delight_version = 1.21.1-1.2.9

## Modrinth localRuntime coords (what the dev runtime downloads).
# create_aeronautics_version is the single source of truth for the runtime stack:
# Simulated (compiled against, extracted from this jar) and Aeronautics both follow it.
sable_mod_version=2.0.6
create_mod_version=6.0.10
create_aeronautics_version=1.3.2

## neoforge.mods.toml required version ranges (what the mod refuses to load without).
# This addon rides Simulated's ZiplineClientManager/RopeRidingPacket API, which can
# move between Simulated minors; pin the range so the mod cleanly refuses to load on
# an untested Simulated/Aeronautics rather than crashing. Bump together with
# create_aeronautics_version after rebuilding and testing against the new stack.
# Aeronautics bundles Simulated and Sable, so these floors are what block old Aeronautics.
simulated_version_range=[1.3.0,1.4.0)
sable_version_range=[2.0.0,3.0.0)
